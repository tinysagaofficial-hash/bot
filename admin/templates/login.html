<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#1a1d23; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-box {
    background:#1e2128; border:1px solid #2a2d35; border-radius:16px;
    padding:40px 36px; width:100%; max-width:380px;
  }
  .login-box h2 { color:#cba6f7; font-size:1.5rem; margin-bottom:6px; }
  .login-box p { color:#6c7086; font-size:.85rem; margin-bottom:28px; }
  .form-control {
    background:#252831; border:1px solid #2a2d35; color:#cdd6f4; border-radius:8px;
    padding:10px 14px;
  }
  .form-control:focus { background:#2a2d35; border-color:#cba6f7; box-shadow:none; color:#cdd6f4; }
  .form-control::placeholder { color:#6c7086; }
  label { color:#a6adc8; font-size:.85rem; margin-bottom:6px; }
  .btn-login {
    background:#cba6f7; color:#1e2128; border:0; border-radius:8px;
    padding:11px; font-weight:600; width:100%; font-size:.95rem;
  }
  .btn-login:hover { background:#b893e8; color:#1e2128; }
  .error { background:#f38ba822; border:1px solid #f38ba8; border-radius:8px;
           color:#f38ba8; padding:10px 14px; font-size:.85rem; margin-bottom:16px; }
</style>
</head>
<body>
<div class="login-box">
  <h2>🤖 Elon Admin</h2>
  <p>Bot boshqaruv paneli</p>
  {% if error %}
  <div class="error"><i class="fas fa-exclamation-circle me-1"></i> {{ error }}</div>
  {% endif %}
  <form method="POST" action="/admin/login">
    <div class="mb-3">
      <label>Login</label>
      <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
    </div>
    <div class="mb-4">
      <label>Parol</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login">Kirish</button>
  </form>
</div>
</body>
</html>
